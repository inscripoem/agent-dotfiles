MinAlertLevel = suggestion
StylesPath = styles

# Required for pure-Chinese tokens: Vale's default WordTemplate wraps tokens
# with ASCII word boundaries (\b), which never occur inside continuous Chinese
# text — rules would silently match nothing. Global tradeoff: Latin tokens
# start matching inside longer words; Chinese-primary repositories only.
WordTemplate = (?m)(?:%s)

[*]
BasedOnStyles = Project
